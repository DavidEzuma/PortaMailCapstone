<section class="screen has-footer" data-screen="NAV_ERROR" id="screenNavError">
  <div class="screen-body nav-error-body">
    <div class="nav-error-icon" aria-hidden="true">⚠</div>
    <div class="status emphasized nav-error-title">Navigation Failed</div>
    <div class="status nav-error-message" id="navErrorMessage">
      Robot is returning to base.
    </div>
    <div class="status nav-error-sub">The robot will return to the mailroom automatically.</div>
  </div>
  <div class="screen-footer">
    <button class="btn nav-error-dismiss-btn"
            data-bit="back_pressed"
            data-edge="nav_error_dismiss">OK — Go Home</button>
  </div>
</section>
